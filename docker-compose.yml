name: mockhub

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-mockhub}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-mockhub}
      MYSQL_USER: ${DB_USER:-mockhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mockhub123}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-33388}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${DB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-mockhub}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      BASE_URL: ${BASE_URL:-http://localhost:3119}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8119}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      MOCK_RATE_LIMIT: ${MOCK_RATE_LIMIT:-120}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mockhub}
      DB_USER: ${DB_USER:-mockhub}
      DB_PASSWORD: ${DB_PASSWORD:-mockhub123}
      JWT_SECRET: ${JWT_SECRET:-mockhub-dev-secret-change-me}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME_MIN: ${DB_CONN_MAX_LIFETIME_MIN:-5}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-10}
      DB_CONNECT_RETRY_INTERVAL_SEC: ${DB_CONNECT_RETRY_INTERVAL_SEC:-3}
    ports:
      - "${BACKEND_PORT:-3119}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-mockhub}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8119}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
